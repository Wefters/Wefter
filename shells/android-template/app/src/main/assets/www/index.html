<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <h1>Bridge test</h1>
    <h2>device-info</h2>
    <pre id="device-out"></pre>
    <h2>ping-test</h2>
    <pre id="ping-out"></pre>
    <script src="wefter-test-global.js"></script>
    <script>
      window.Wefter.invokeNative("device-info", "getInfo", {}).then((result) => {
        document.getElementById("device-out").textContent = JSON.stringify(result, null, 2);
      });
      window.Wefter.invokeNative("ping-test", "ping", {}).then((result) => {
        document.getElementById("ping-out").textContent = JSON.stringify(result, null, 2);
      });
    </script>
  </body>
</html>
